name: Revision tests
on:
  push:
    branches: ['revision/**']
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-revision.txt
            requirements-temporal-revision.txt
      - run: python -m pip install -r requirements-revision.txt -r requirements-temporal-revision.txt
      - run: python -m pytest tests -q
      - run: python scripts/verify_frozen_protocol_v2.py
      - run: python scripts/verify_revision_evidence.py
      - run: python results/revision/distributed_live_vps_campaign_20261012/run07/verify_campaign.py
